# Intégration continue : à chaque push et pull request, on vérifie que le projet
# s'installe proprement, respecte le lint, compile, passe ses tests et que le tableau de bord se construit.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # version minimale annoncée dans le README, et version de développement
        node: [22, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
